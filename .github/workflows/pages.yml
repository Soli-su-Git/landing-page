name: Pagina

# Costruisce la pagina pubblica e la pubblica su GitHub Pages.
#
# Niente di generato sta nel repo: `site/` nasce qui a ogni giro, da
# `data/routing.json` e da quello che Telegram risponde in quel momento.
#
# Due segreti, e fanno due cose diverse:
#   BOT_TOKEN      il token del bot: serve per iscritti e foto dei gruppi.
#                  Senza, la pagina esce lo stesso ma senza numeri né foto.
#   SOLIZIA_TOKEN  un token con accesso in lettura al repo (privato) del bot,
#                  da cui si riprendono gruppi e topic. Senza, si usa la copia
#                  committata in data/routing.json: più vecchia, ma c'è.
#
# Di proposito **non** gira sulle pull request: una PR aperta da un branch di
# questo repo riceverebbe i segreti, e chi l'ha aperta potrebbe farseli stampare.

on:
  push:
    branches: [main]
  # i numeri cambiano da soli anche quando nessuno committa
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un deploy alla volta, e quello in corso si lascia finire
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prendi gruppi e topic dal repo del bot
        id: tabelle
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Soli-su-Git/solizia
          token: ${{ secrets.SOLIZIA_TOKEN }}
          sparse-checkout: public/routing.json
          sparse-checkout-cone-mode: false
          path: .solizia

      - name: Aggiorna le tabelle, o tieni quelle committate
        run: |
          if [ -f .solizia/public/routing.json ]; then
            cp .solizia/public/routing.json data/routing.json
            echo "tabelle aggiornate dal repo del bot"
          else
            echo "::warning::non ho letto le tabelle dal repo del bot (SOLIZIA_TOKEN?): uso data/routing.json committato"
          fi
          rm -rf .solizia

      # build_page.py usa solo la libreria standard: niente da installare
      - name: Genera la pagina
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            python build_page.py
          else
            echo "::warning::BOT_TOKEN non configurato: pagina senza numeri né foto"
            python build_page.py --offline
          fi

      - name: Controlla che il token non sia finito in pagina
        run: |
          if grep -q "api.telegram.org/file/bot" site/index.html; then
            echo "::error::la pagina contiene un indirizzo di scarico con il token"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
